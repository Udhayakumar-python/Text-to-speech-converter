<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: arial,sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color:#333;
        }
        #container{
           background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
           h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }
  textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            resize: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: #fff;
            border: 3px grey solid;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
          
        }
        button:hover{
            background-color: #0e0372;
              transition: background-color 1.9s ease-in-out;
        }


    </style>
</head>
<body>
   <div id="container">
    <h1>Text to speech</h1>
   <textarea id="textTospeak" placeholder="enter the text..."></textarea>
   <button onclick="speakText()">Speak</button>
   </div>
   <script>
      var speech = new SpeechSynthesisUtterance();
    function speakText(){
       var textTospeak = document.getElementById('textTospeak').value;
            if(textTospeak.trim() !==""){
                speech.text=textTospeak;
                speech.rate=1;
                speech.volume=9;
                speech.pitch=1;
                
                window.speechSynthesis.speak(speech);
            }
            else{
                alert("please enter an text")
            }


    }

   </script>
</body>
</html>
